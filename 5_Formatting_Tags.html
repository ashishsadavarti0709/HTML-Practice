<!DOCTYPE html>

<head>

    <meta name="author" content="Ashish">
    <meta name="keywords" content="HTML CSS">
    <meta name="description" content="We are learning HTML">
</head>
<body>
    <p>This is a <sup>superscript</sup> text.</p>
    <p>2 <sup>5</sup></p>
    <p>This is a <sub>subscript</sub> text.</p>
    <p>H<sub>2</sub>O</p>
    <p>Ths is a normal text.</p>
    <small>This is a smaller text.</small>
    <p>My favourite color is <mark>red</mark></p>
    <p>My favourite color is not <del>blue</del> but red.</p>
</body>
