<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>11_Input_Types</title>
    <meta name="author" content="Ashish">
    <meta name="keywords" content="HTML CSS">
    <meta name="description" content="We are learning HTML">
</head>
<body>
    <form action="">
        <label for="FirstName">Enter First Name</label>
        <input type="text" id="FirstName" name="FirstName">
        <br/>
        <br/>
        <label for="LastName">Enter Last Name</label>
        <input type="text" id="LastName" name="LastName">
        <br/>
        <br/>
        <label for="email">Enter Email</label>
        <input type="email" id="email" name="Email">
        <br/>
        <br/>
        <label for="password">Enter Password</label>
        <input type="password" id="password" name="Password">
        <br/>
        <br/>
        <input type="radio" id="male" name="gender" value="Male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label>
        <br/>
        <br/>
        <p>Select your favourite language</p>
        <input type="checkbox" id="HTML" name="fav_language" value="HTML">
        <label for="HTML">HTML</label>
        <input type="checkbox" id="CSS" name="fav_language" value="CSS">
        <label for="CSS">CSS</label>
        <input type="checkbox" id="JavaScript" name="fav_language" value="JavaScript">
        <label for="JavaScript">JavaScript</label>
        <br/>
        <br/>
        <label for="age">Enter your age</label>
        <input type="number" id="age" name="age">
        <br/>
        <br/>
        <label for="birthday">Enter your birthday</label>
        <input type="date" id="birthday" name="birthday" >
        <br/>
        <br/>
        <input type="Submit" value="Submit">
    </form>
</body>
</html>
